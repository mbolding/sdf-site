<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math expression evaluator, first version · mbolding</title>
<link rel="stylesheet" href="../style.css">
<script src="../theme.js"></script>
<style>
#expression { width: 100%; font-size: 16px; }
#result { min-height: 2.8em; font: 18px/1.5 var(--font-ui); }
.history-item { padding: 0.3em 0; border-bottom: 1px solid var(--rule); font-family: var(--font-mono); }
.history-item:last-child { border-bottom: none; }
</style>
</head>
<body>
<header><a href="../">mbolding</a> · <a href="./">Calc</a></header>
<h1>Math Expression Evaluator</h1>

<div class="row">
    <input type="text" id="expression" placeholder="Enter a math expression (e.g., 2 + 2 * 3)" autofocus="">
    <button class="primary" onclick="evaluateExpression()">Calculate</button>
</div>

<div id="result" class="box">Result will appear here</div>

<div class="examples">
    <h2>Example expressions</h2>
    <ul>
        <li><code>2 + 2 * 3</code></li>
        <li><code>sqrt(16) + 3^2</code></li>
        <li><code>sin(PI/2)</code></li>
        <li><code>(10 + 5) / 3</code></li>
        <li><code>log(100)</code></li>
    </ul>
</div>

<div class="history">
    <h2>Calculation History</h2>
    <div id="history-list"></div>
</div>

<script>
        // Store calculation history
        let history = [];
        
        function evaluateExpression() {
            const expressionInput = document.getElementById('expression');
            const resultDiv = document.getElementById('result');
            const expression = expressionInput.value.trim();
            
            if (!expression) {
                resultDiv.innerHTML = '<span class="bad">Please enter an expression</span>';
                return;
            }
            
            try {
                // Create a safe evaluation context with math functions
                const mathContext = {
                    sin: Math.sin,
                    cos: Math.cos,
                    tan: Math.tan,
                    asin: Math.asin,
                    acos: Math.acos,
                    atan: Math.atan,
                    sqrt: Math.sqrt,
                    abs: Math.abs,
                    log: Math.log10,
                    ln: Math.log,
                    PI: Math.PI,
                    E: Math.E,
                    pow: Math.pow
                };
                
                // Replace common math notations
                let processedExpression = expression
                    .replace(/\^/g, '**')                    // Replace ^ with ** for exponentiation
                    .replace(/π/g, 'PI')                     // Replace π with PI
                    .replace(/\b(\d+)!(?!=)/g, 'factorial($1)') // Replace n! with factorial(n)
                    .replace(/(\d+(?:\.\d+)?)\s*\*\*\s*(\d+(?:\.\d+)?)/g, 'pow($1,$2)'); // x^y to pow(x,y)
                
                // Define factorial function
                mathContext.factorial = function(n) {
                    if (n < 0) return NaN;
                    if (n === 0) return 1;
                    let result = 1;
                    for (let i = 2; i <= n; i++) result *= i;
                    return result;
                };
                
                // Create function from expression using our safe context
                const func = new Function(...Object.keys(mathContext), `return ${processedExpression};`);
                const result = func(...Object.values(mathContext));
                
                // Display the result
                if (isNaN(result)) {
                    resultDiv.innerHTML = '<span class="bad">Invalid expression</span>';
                } else if (!isFinite(result)) {
                    resultDiv.innerHTML = '<span class="bad">Result is infinity</span>';
                } else {
                    // Format the result: show up to 10 decimal places, but trim trailing zeros
                    const formattedResult = Number(result.toFixed(10)).toString();
                    resultDiv.textContent = formattedResult;
                    
                    // Add to history
                    history.unshift({ expression, result: formattedResult });
                    if (history.length > 10) history.pop(); // Keep only last 10 calculations
                    updateHistory();
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="bad">Error: ${error.message}</span>`;
            }
        }
        
        function updateHistory() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            history.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.textContent = `${item.expression} = ${item.result}`;
                historyList.appendChild(historyItem);
            });
        }
        
        // Add event listener for Enter key
        document.getElementById('expression').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                evaluateExpression();
            }
        });
</script>
</body>
</html>
