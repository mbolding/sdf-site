<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trig Function Plotter</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <h1>Trig Function Plotter</h1>
    <label for="trig-function">Select a trigonometric function:</label>
    <select id="trig-function">
        <option value="sin">Sine (sin)</option>
        <option value="cos">Cosine (cos)</option>
        <option value="tan">Tangent (tan)</option>
    </select>
    <div id="plot"></div>
    <script src="script.js"></script>
</body>
</html>
