<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trig function plotter 6 · mbolding</title>
<link rel="stylesheet" href="../style.css">
<script src="../theme.js"></script>
<script src="https://cdn.plot.ly/plotly-1.58.5.min.js"></script>
</head>
<body class="wide">
<header><a href="../">mbolding</a> · <a href="./">Old experiments</a></header>
<h1>Trig function plotter</h1>
<div class="row">
  <select id="func" onchange="plot()">
    <option value="sin" selected>sin</option>
    <option value="cos">cos</option>
    <option value="tan">tan</option>
  </select>
  <label>X range:
  <input type="number" id="xMin" value="0" step="0.1" onchange="plot()">
  to
  <input type="number" id="xMax" value="6.283" step="0.1" onchange="plot()"></label>
</div>
<div id="myDiv"></div>

<script>
  function color(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function plot() {
    var func = document.getElementById('func').value;
    var xMin = parseFloat(document.getElementById('xMin').value);
    var xMax = parseFloat(document.getElementById('xMax').value);
    var x = [];
    var y = [];
    var increment = (xMax - xMin) / 360;
    var xi = xMin;
    while (xi <= xMax) {
      x.push(xi);
      if (func == 'sin') {
        y.push(Math.sin(xi));
      } else if (func == 'cos') {
        y.push(Math.cos(xi));
      } else if (func == 'tan') {
        y.push(Math.tan(xi));
      }
      xi += increment;
    }

    var data = [{x: x, y: y, mode: 'lines+markers', name: func, marker: {color: color('--link')}, line: {color: color('--link')}}];
    var layout = {title: 'Trigonometric function',
                 xaxis: {title: 'Angle (radians)', gridcolor: color('--rule'), zerolinecolor: color('--muted'), linecolor: color('--rule')},
                 yaxis: {title: 'Amplitude', gridcolor: color('--rule'), zerolinecolor: color('--muted'), linecolor: color('--rule')},
                 font: {color: color('--text'), family: color('--font-ui')},
                 paper_bgcolor: 'transparent',
                 plot_bgcolor: 'transparent'};

    Plotly.newPlot('myDiv', data, layout);
  }

  window.onload = function() {
    plot();
  }
  window.addEventListener('themechange', plot);
</script>
</body>
</html>
