<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiples of 3 and 5 · mbolding</title>
<link rel="stylesheet" href="../style.css">
<script src="../theme.js"></script>
</head>
<body>
<header><a href="../">mbolding</a> · <a href="./">Old experiments</a></header>
<h1>Multiples of 3 and 5</h1>

<p>Enter a number:</p>
<div class="row">
  <input type="number" id="number-input" value="10">
  <button class="primary" onclick="calculate()">Calculate</button>
</div>

<p id="output"></p>

<script>
	function multiplesOf3and5(number) {
	    var total = 0;
	    for (n = 0; n < number; n++) {
	        if (n % 3 == 0) {
	            total += n;
	        } else if (n % 5 == 0) {
	            total += n;
	        }
	    }
	    return total;
	}

	function calculate() {
		// Get the input value
		var number = parseInt(document.getElementById("number-input").value);

		// Calculate the result
		var result = multiplesOf3and5(number);

		// Set the output text
		document.getElementById("output").innerText = "The sum of all multiples of 3 and 5 below " + number + " is " + result;
	}
</script>
</body>
</html>
