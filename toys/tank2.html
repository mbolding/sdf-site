<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Driving Game · mbolding</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../theme.js"></script>
    <style>
        #gameArea {
            width: 300px;
            height: 300px;
            background: color-mix(in srgb, var(--good) 35%, var(--surface));
            border: 1px solid var(--rule);
            border-radius: var(--radius);
            position: relative;
            overflow: hidden;
        }
        #tank {
            width: 40px;
            height: 40px;
            background: var(--muted);
            position: absolute;
            transition: transform 0.1s;
        }
        #tank:before {
            content: '';
            position: absolute;
            width: 30px;
            height: 8px;
            background: var(--text);
            top: 16px;
            left: 40px;
        }
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            background: color-mix(in srgb, var(--surface) 75%, transparent);
            padding: 5px;
            border-radius: var(--radius);
            font: 12px/1.4 var(--font-ui);
        }
    </style>
</head>
<body>
    <header><a href="../">mbolding</a> · <a href="./">Toys</a></header>
    <h1>Tank Driving Game</h1>
    <div id="gameArea">
        <div id="tank"></div>
        <div id="instructions">W/S: Move forward/backward<br>A/D: Turn left/right</div>
    </div>

    <script>
        const tank = document.getElementById('tank');
        const gameArea = document.getElementById('gameArea');
        let x = 130;
        let y = 130;
        let angle = 0;

        function updateTankPosition() {
            tank.style.left = `${x}px`;
            tank.style.top = `${y}px`;
            tank.style.transform = `rotate(${angle}deg)`;
        }

        function moveTank(direction) {
            const speed = 5;
            const rotationSpeed = 5;
            
            switch (direction) {
                case 'w':
                    x += speed * Math.sin(angle * Math.PI / 180);
                    y -= speed * Math.cos(angle * Math.PI / 180);
                    break;
                case 's':
                    x -= speed * Math.sin(angle * Math.PI / 180);
                    y += speed * Math.cos(angle * Math.PI / 180);
                    break;
                case 'a':
                    angle -= rotationSpeed;
                    break;
                case 'd':
                    angle += rotationSpeed;
                    break;
            }

            // Keep the tank within the game area
            x = Math.max(0, Math.min(gameArea.clientWidth - tank.clientWidth, x));
            y = Math.max(0, Math.min(gameArea.clientHeight - tank.clientHeight, y));

            updateTankPosition();
        }

        document.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            if (['w', 'a', 's', 'd'].includes(key)) {
                moveTank(key);
                event.preventDefault();
            }
        });

        updateTankPosition();
    </script>
</body>
</html>
