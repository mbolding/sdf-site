<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexagon Board Game with Multiple Piece Types · mbolding</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../theme.js"></script>
    <style>
        :root {
            --piece-pawn: var(--link);
            --piece-rook: var(--bad);
            --piece-knight: var(--good);
            --piece-bishop: var(--warn);
            --piece-queen: color-mix(in srgb, var(--link) 50%, var(--bad));
            --piece-king: var(--text);
        }
        canvas {
            display: block;
            max-width: none;
            background: var(--surface);
            border: 1px solid var(--rule);
        }
        #gameContainer {
            position: relative;
            margin-top: 20px;
        }
        .gamePiece {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            position: absolute;
            cursor: move;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: var(--on-link);
            user-select: none;
        }
        .gamePiece[data-type="pawn"] { background: var(--piece-pawn); }
        .gamePiece[data-type="rook"] { background: var(--piece-rook); }
        .gamePiece[data-type="knight"] { background: var(--piece-knight); }
        .gamePiece[data-type="bishop"] { background: var(--piece-bishop); }
        .gamePiece[data-type="queen"] { background: var(--piece-queen); }
        .gamePiece[data-type="king"] { background: var(--piece-king); }
    </style>
</head>
<body class="wide">
    <header><a href="../">mbolding</a> · <a href="./">Toys</a></header>
    <h1>Hexagon Board Game with Multiple Piece Types</h1>
    <div class="row">
        <label for="rows">Rows:</label>
        <input type="number" id="rows" min="1" max="20" value="6">
        <label for="cols">Columns:</label>
        <input type="number" id="cols" min="1" max="20" value="6">
        <button onclick="generateBoard()">Generate Board</button>
    </div>
    <div class="row">
        <label for="pieceType">Piece Type:</label>
        <select id="pieceType">
            <option value="pawn">Pawn</option>
            <option value="rook">Rook</option>
            <option value="knight">Knight</option>
            <option value="bishop">Bishop</option>
            <option value="queen">Queen</option>
            <option value="king">King</option>
        </select>
    </div>
    <div id="gameContainer">
        <canvas id="hexCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('hexCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('gameContainer');
        const pieceTypeSelect = document.getElementById('pieceType');

        let isDragging = false;
        let draggedPiece = null;
        let dragOffsetX, dragOffsetY;

        const pieceTypes = {
            pawn: { symbol: '♙' },
            rook: { symbol: '♖' },
            knight: { symbol: '♘' },
            bishop: { symbol: '♗' },
            queen: { symbol: '♕' },
            king: { symbol: '♔' }
        };

        function drawHexagon(x, y, size) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (2 * Math.PI / 6 * i) + (Math.PI / 6);
                const xPos = x + size * Math.cos(angle);
                const yPos = y + size * Math.sin(angle);
                if (i === 0) {
                    ctx.moveTo(xPos, yPos);
                } else {
                    ctx.lineTo(xPos, yPos);
                }
            }
            ctx.closePath();
            ctx.stroke();
        }

        function generateBoard() {
            const rows = parseInt(document.getElementById('rows').value);
            const cols = parseInt(document.getElementById('cols').value);
            const hexSize = 20;
            const hexHeight = hexSize * 2;
            const hexWidth = Math.sqrt(3) * hexSize;

            canvas.width = (cols + 0.5) * hexWidth;
            canvas.height = (rows + 0.5) * (hexHeight * 0.75);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const x = col * hexWidth + ((row % 2) * (hexWidth / 2)) + (hexWidth / 2);
                    const y = row * (hexHeight * 0.75) + (hexHeight / 2);
                    drawHexagon(x, y, hexSize);
                }
            }

            gameContainer.style.width = canvas.width + 'px';
            gameContainer.style.height = canvas.height + 'px';
        }

        function createGamePiece(x, y, type) {
            const piece = document.createElement('div');
            piece.className = 'gamePiece';
            piece.style.left = x + 'px';
            piece.style.top = y + 'px';
            piece.textContent = pieceTypes[type].symbol;
            piece.dataset.type = type;
            gameContainer.appendChild(piece);

            piece.addEventListener('mousedown', startDragging);
        }

        function startDragging(e) {
            isDragging = true;
            draggedPiece = e.target;
            const rect = draggedPiece.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;
        }

        function drag(e) {
            if (isDragging && draggedPiece) {
                const containerRect = gameContainer.getBoundingClientRect();
                let newX = e.clientX - containerRect.left - dragOffsetX;
                let newY = e.clientY - containerRect.top - dragOffsetY;

                // Constrain the game piece within the canvas
                newX = Math.max(0, Math.min(newX, canvas.width - draggedPiece.offsetWidth));
                newY = Math.max(0, Math.min(newY, canvas.height - draggedPiece.offsetHeight));

                draggedPiece.style.left = newX + 'px';
                draggedPiece.style.top = newY + 'px';
            }
        }

        function stopDragging() {
            isDragging = false;
            draggedPiece = null;
        }

        gameContainer.addEventListener('dblclick', function(e) {
            const rect = gameContainer.getBoundingClientRect();
            const x = e.clientX - rect.left - 15; // 15 is half the width of the game piece
            const y = e.clientY - rect.top - 15; // 15 is half the height of the game piece
            const selectedType = pieceTypeSelect.value;
            createGamePiece(x, y, selectedType);
        });

        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', stopDragging);

        // Redraw the grid lines in the new colours when the system switches light/dark
        window.addEventListener('themechange', generateBoard);

        // Initial board generation
        generateBoard();
    </script>
</body>
</html>
