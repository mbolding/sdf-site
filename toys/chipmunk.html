<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Like a Chipmunk at Philmont · mbolding</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../theme.js"></script>
    <style>
        .checklist { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 0.9em 1.1em; }
        .item { margin-bottom: 0.4em; }
        .item input[type="checkbox"] { margin-right: 0.6em; }
        .item input[type="checkbox"]:checked + label { color: var(--good); font-weight: bold; }
        #progress-container {
            margin-top: 1.2em;
            height: 30px;
            position: relative;
            overflow: hidden;
            background: var(--panel);
            border: 1px solid var(--rule);
            border-radius: var(--radius);
        }
        #progress-bar {
            height: 100%;
            width: 0;
            background: color-mix(in srgb, var(--link) 40%, var(--surface));
            transition: width 0.5s ease-in-out;
        }
        #progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font: 600 15px var(--font-ui);
            color: var(--text);
        }
        #message {
            text-align: center;
            margin-top: 1em;
            font-weight: bold;
            font-size: 1.2em;
            min-height: 1.5em;
            color: var(--good);
        }
        #reset-button { display: block; margin: 1.2em auto; }
    </style>
</head>
<body>
    <header><a href="../">mbolding</a> · <a href="./">Toys</a></header>
    <div class="content">
        <h1>Live Like a Chipmunk at Philmont</h1>
        <div class="checklist">
            <div class="item"><input type="checkbox" id="item1" onchange="updateProgress()"><label for="item1">Scurry quickly between rocks and trees</label></div>
            <div class="item"><input type="checkbox" id="item2" onchange="updateProgress()"><label for="item2">Gather and store acorns for winter</label></div>
            <div class="item"><input type="checkbox" id="item3" onchange="updateProgress()"><label for="item3">Chirp loudly to alert others of danger</label></div>
            <div class="item"><input type="checkbox" id="item4" onchange="updateProgress()"><label for="item4">Build a cozy nest in a hollow tree</label></div>
            <div class="item"><input type="checkbox" id="item5" onchange="updateProgress()"><label for="item5">Practice your climbing skills daily</label></div>
            <div class="item"><input type="checkbox" id="item6" onchange="updateProgress()"><label for="item6">Forage for berries and seeds</label></div>
            <div class="item"><input type="checkbox" id="item7" onchange="updateProgress()"><label for="item7">Take dust baths to keep your fur clean</label></div>
            <div class="item"><input type="checkbox" id="item8" onchange="updateProgress()"><label for="item8">Observe hikers from a safe distance</label></div>
            <div class="item"><input type="checkbox" id="item9" onchange="updateProgress()"><label for="item9">Practice your balance on thin branches</label></div>
            <div class="item"><input type="checkbox" id="item10" onchange="updateProgress()"><label for="item10">Memorize the best hiding spots</label></div>
            <div class="item"><input type="checkbox" id="item11" onchange="updateProgress()"><label for="item11">Groom your tail to keep it fluffy</label></div>
            <div class="item"><input type="checkbox" id="item12" onchange="updateProgress()"><label for="item12">Take quick power naps throughout the day</label></div>
        </div>
        <div id="progress-container">
            <div id="progress-bar"></div>
            <div id="progress-text">0%</div>
        </div>
        <div id="message"></div>
        <button id="reset-button" class="primary" onclick="resetCheckboxes()">Reset Acorn Stash</button>
    </div>

    <script>
        function updateProgress() {
            const total = 12;
            const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
            const percentage = (checked / total) * 100;
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            const messageElement = document.getElementById('message');

            progressBar.style.width = `${percentage}%`;
            progressText.textContent = `${percentage.toFixed(1)}%`;

            if (percentage === 100) {
                messageElement.textContent = "Congratulations! You're now the most Philmont-savvy chipmunk!";
            } else if (percentage >= 75) {
                messageElement.textContent = "You're almost there! Just a few more acorns to gather!";
            } else if (percentage >= 50) {
                messageElement.textContent = "Halfway to becoming a true Philmont chipmunk!";
            } else if (percentage > 0) {
                messageElement.textContent = "Good start! Keep exploring and gathering!";
            } else {
                messageElement.textContent = "Time to start your chipmunk adventure at Philmont!";
            }
        }

        function resetCheckboxes() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = false;
            });
            updateProgress();
        }
    </script>
</body>
</html>
