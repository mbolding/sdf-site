<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plain Minesweeper · mbolding</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../theme.js"></script>
    <style>
        :root {
            --cell-size-sm: 30px;
            --cell-size-md: 36px;
            --cell-size-lg: 40px;
            /* number colours, all taken from the theme */
            --n1: var(--link);
            --n2: var(--good);
            --n3: var(--bad);
            --n4: color-mix(in srgb, var(--link) 50%, var(--bad));
            --n5: var(--warn);
            --n6: color-mix(in srgb, var(--link) 50%, var(--good));
            --n7: color-mix(in srgb, var(--warn) 50%, var(--text));
            --n8: var(--muted);
        }
        
        .number-1 { color: var(--n1); }
        .number-2 { color: var(--n2); }
        .number-3 { color: var(--n3); }
        .number-4 { color: var(--n4); }
        .number-5 { color: var(--n5); }
        .number-6 { color: var(--n6); }
        .number-7 { color: var(--n7); }
        .number-8 { color: var(--n8); }
        
        @media (max-width: 640px) {
            .grid-container {
                --cell-size: var(--cell-size-sm);
            }
        }
        
        @media (min-width: 641px) and (max-width: 1024px) {
            .grid-container {
                --cell-size: var(--cell-size-md);
            }
        }
        
        @media (min-width: 1025px) {
            .grid-container {
                --cell-size: var(--cell-size-lg);
            }
        }
        
        .panel {
            background: var(--panel);
            border: 1px solid var(--rule);
            border-radius: var(--radius);
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .counter {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.6rem;
            background: var(--surface);
            border: 1px solid var(--rule);
            border-radius: var(--radius);
            font: bold 15px var(--font-mono);
        }
        #new-game-btn {
            font-weight: bold;
        }
        .difficulty {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
        }
        .difficulty-btn {
            font-size: 14px;
            padding: 0.25em 0.75em;
        }
        #difficulty-desc-line {
            margin: 0 0 1rem;
            text-align: center;
            font: 12px var(--font-ui);
            color: var(--muted);
        }
        .board-wrap {
            display: flex;
            justify-content: center;
        }
        .grid-container {
            overflow: auto;
            border: 1px solid var(--rule);
            border-radius: var(--radius);
        }
        #game-grid {
            display: grid;
            background: var(--rule);
            user-select: none;
        }
        
        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            align-items: center;
            justify-content: center;
            font: bold 16px var(--font-ui);
            background: var(--surface);
            border: 1px solid var(--rule);
            cursor: pointer;
            user-select: none;
        }
        .cell.revealed {
            background: var(--panel);
            cursor: default;
        }
        .cell.exploded {
            background: color-mix(in srgb, var(--bad) 30%, var(--surface));
        }
        .flag {
            color: var(--bad);
        }
        .help {
            text-align: center;
            font: 14px/1.5 var(--font-ui);
            color: var(--muted);
        }
        .help p {
            margin: 0 0 0.25em;
        }
        
        .animate-pop { animation: pop 0.3s ease-out; }
        .animate-shake { animation: shake 0.5s ease-in-out; }
        @keyframes pop {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
    </style>
</head>
<body class="wide">
    <header><a href="../">mbolding</a> · <a href="./">Toys</a></header>
    <h1>Plain Minesweeper</h1>
    
    <div class="panel">
        <div class="toolbar">
            <div class="counter">
                <span>💣</span>
                <span id="mine-counter">10</span>
            </div>
            
            <div>
                <button id="new-game-btn" class="primary">
                    <span id="game-emoji">😊</span> New Game
                </button>
            </div>
            
            <div class="counter">
                <span>⏱️</span>
                <span id="timer">000</span>
            </div>
        </div>
        
        <div>
            <div class="difficulty">
                <button class="difficulty-btn" data-difficulty="easy">Easy</button>
                <button class="difficulty-btn" data-difficulty="medium">Medium</button>
                <button class="difficulty-btn" data-difficulty="hard">Hard</button>
            </div>
            <p id="difficulty-desc-line">
                <span id="difficulty-desc">9x9 grid with 10 mines</span>
            </p>
        </div>
        
        <div class="board-wrap">
            <div id="grid-container" class="grid-container">
                <div id="game-grid"></div>
            </div>
        </div>
    </div>
    
    <div class="help">
        <p>Left click to reveal a cell. Right click to flag a mine.</p>
        <p>On mobile, tap to reveal. Long press to flag.</p>
    </div>

    <script>
        // Game Configuration
        const GAME_CONFIG = {
            easy: { rows: 9, cols: 9, mines: 10 },
            medium: { rows: 16, cols: 16, mines: 40 },
            hard: { rows: 16, cols: 30, mines: 99 }
        };
        
        // Game state
        let gameState = {
            difficulty: 'easy',
            grid: [],
            minesLeft: GAME_CONFIG.easy.mines,
            timerInterval: null,
            time: 0,
            firstClick: true,
            gameOver: false
        };
        
        // Elements
        const gameGrid = document.getElementById('game-grid');
        const mineCounter = document.getElementById('mine-counter');
        const timer = document.getElementById('timer');
        const newGameBtn = document.getElementById('new-game-btn');
        const gameEmoji = document.getElementById('game-emoji');
        const difficultyBtns = document.querySelectorAll('.difficulty-btn');
        const difficultyDesc = document.getElementById('difficulty-desc');
        
        // Initialize the game
        initGame();
        
        // Set up event listeners
        newGameBtn.addEventListener('click', () => {
            startNewGame(gameState.difficulty);
        });
        
        difficultyBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const difficulty = btn.dataset.difficulty;
                startNewGame(difficulty);
                updateDifficultyButtons();
            });
        });

        function initGame() {
            updateDifficultyButtons();
            startNewGame('easy');
        }
        
        function updateDifficultyButtons() {
            difficultyBtns.forEach(btn => {
                const btnDifficulty = btn.dataset.difficulty;
                btn.classList.toggle('active', btnDifficulty === gameState.difficulty);
            });
            
            const config = GAME_CONFIG[gameState.difficulty];
            difficultyDesc.textContent = `${config.rows}x${config.cols} grid with ${config.mines} mines`;
        }
        
        function startNewGame(difficulty) {
            clearInterval(gameState.timerInterval);
            
            // Update game state
            gameState.difficulty = difficulty;
            gameState.grid = [];
            gameState.minesLeft = GAME_CONFIG[difficulty].mines;
            gameState.time = 0;
            gameState.firstClick = true;
            gameState.gameOver = false;
            
            // Update UI
            gameEmoji.textContent = '😊';
            mineCounter.textContent = gameState.minesLeft;
            timer.textContent = '000';
            
            // Create grid
            createGrid();
            
            // Update difficulty buttons
            updateDifficultyButtons();
        }
        
        function createGrid() {
            gameGrid.innerHTML = '';
            const config = GAME_CONFIG[gameState.difficulty];
            
            // Set grid columns
            gameGrid.style.gridTemplateColumns = `repeat(${config.cols}, minmax(0, 1fr))`;
            
            // Initialize empty grid
            gameState.grid = Array(config.rows).fill().map(() => 
                Array(config.cols).fill().map(() => ({
                    isMine: false,
                    isRevealed: false,
                    isFlagged: false,
                    adjacentMines: 0
                }))
            );
            
            // Create cell elements
            for (let row = 0; row < config.rows; row++) {
                for (let col = 0; col < config.cols; col++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    // Add event listeners
                    cell.addEventListener('click', handleCellClick);
                    cell.addEventListener('contextmenu', handleCellRightClick);
                    
                    // For mobile support
                    let touchTimeout;
                    cell.addEventListener('touchstart', (e) => {
                        touchTimeout = setTimeout(() => {
                            handleCellRightClick(e);
                            touchTimeout = null;
                        }, 300);
                    });
                    
                    cell.addEventListener('touchend', (e) => {
                        if (touchTimeout) {
                            clearTimeout(touchTimeout);
                            handleCellClick(e);
                        }
                        e.preventDefault();
                    });
                    
                    gameGrid.appendChild(cell);
                }
            }
        }
        
        function placeMines(safeRow, safeCol) {
            const config = GAME_CONFIG[gameState.difficulty];
            let minesPlaced = 0;
            
            while (minesPlaced < config.mines) {
                const row = Math.floor(Math.random() * config.rows);
                const col = Math.floor(Math.random() * config.cols);
                
                // Skip if it's the first clicked cell or already has a mine
                if ((row === safeRow && col === safeCol) || gameState.grid[row][col].isMine) {
                    continue;
                }
                
                gameState.grid[row][col].isMine = true;
                minesPlaced++;
            }
            
            // Calculate adjacent mines
            for (let row = 0; row < config.rows; row++) {
                for (let col = 0; col < config.cols; col++) {
                    if (!gameState.grid[row][col].isMine) {
                        gameState.grid[row][col].adjacentMines = countAdjacentMines(row, col);
                    }
                }
            }
        }
        
        function countAdjacentMines(row, col) {
            const config = GAME_CONFIG[gameState.difficulty];
            let count = 0;
            
            // Check all 8 surrounding cells
            for (let r = Math.max(0, row - 1); r <= Math.min(config.rows - 1, row + 1); r++) {
                for (let c = Math.max(0, col - 1); c <= Math.min(config.cols - 1, col + 1); c++) {
                    if (r === row && c === col) continue;
                    if (gameState.grid[r][c].isMine) count++;
                }
            }
            
            return count;
        }
        
        function startTimer() {
            gameState.timerInterval = setInterval(() => {
                gameState.time++;
                timer.textContent = gameState.time.toString().padStart(3, '0');
            }, 1000);
        }
        
        function handleCellClick(e) {
            if (gameState.gameOver) return;
            
            const row = parseInt(e.currentTarget.dataset.row);
            const col = parseInt(e.currentTarget.dataset.col);
            
            // Ignore if flagged
            if (gameState.grid[row][col].isFlagged) return;
            
            // Place mines on first click
            if (gameState.firstClick) {
                gameState.firstClick = false;
                placeMines(row, col);
                startTimer();
            }
            
            // Check if mine
            if (gameState.grid[row][col].isMine) {
                gameOver(false);
                revealCell(row, col, true);
                return;
            }
            
            // Reveal cell
            revealCell(row, col);
            
            // Check for win
            checkWinCondition();
        }
        
        function handleCellRightClick(e) {
            e.preventDefault();
            if (gameState.gameOver || gameState.firstClick) return;
            
            const row = parseInt(e.currentTarget.dataset.row);
            const col = parseInt(e.currentTarget.dataset.col);
            
            // Toggle flag only on unrevealed cells
            if (!gameState.grid[row][col].isRevealed) {
                toggleFlag(row, col);
            }
        }
        
        function toggleFlag(row, col) {
            const cell = gameState.grid[row][col];
            const cellElement = getCellElement(row, col);
            
            cell.isFlagged = !cell.isFlagged;
            
            if (cell.isFlagged) {
                cellElement.innerHTML = '<span class="flag">🚩</span>';
                gameState.minesLeft--;
            } else {
                cellElement.innerHTML = '';
                gameState.minesLeft++;
            }
            
            mineCounter.textContent = gameState.minesLeft;
        }
        
        function revealCell(row, col, exploded = false) {
            const cell = gameState.grid[row][col];
            const cellElement = getCellElement(row, col);
            
            // Skip if already revealed or flagged
            if (cell.isRevealed || (cell.isFlagged && !exploded)) return;
            
            cell.isRevealed = true;
            cellElement.classList.add('revealed', 'animate-pop');
            
            if (cell.isMine) {
                // Exploded mine
                if (exploded) {
                    cellElement.innerHTML = '<span class="flag">💥</span>';
                    cellElement.classList.add('exploded', 'animate-shake');
                } else {
                    // Regular mine (for game over)
                    cellElement.innerHTML = '<span>💣</span>';
                }
            } else {
                // Number
                if (cell.adjacentMines > 0) {
                    cellElement.innerHTML = `<span class="number-${cell.adjacentMines}">${cell.adjacentMines}</span>`;
                } else {
                    // Empty cell - reveal adjacent cells recursively
                    const config = GAME_CONFIG[gameState.difficulty];
                    
                    for (let r = Math.max(0, row - 1); r <= Math.min(config.rows - 1, row + 1); r++) {
                        for (let c = Math.max(0, col - 1); c <= Math.min(config.cols - 1, col + 1); c++) {
                            if (r === row && c === col) continue;
                            revealCell(r, c);
                        }
                    }
                }
            }
        }
        
        function getCellElement(row, col) {
            return gameGrid.querySelector(`[data-row="${row}"][data-col="${col}"]`);
        }
        
        function gameOver(won) {
            gameState.gameOver = true;
            clearInterval(gameState.timerInterval);
            
            gameEmoji.textContent = won ? '😎' : '😵';
            
            if (!won) {
                // Reveal all mines
                const config = GAME_CONFIG[gameState.difficulty];
                for (let row = 0; row < config.rows; row++) {
                    for (let col = 0; col < config.cols; col++) {
                        const cell = gameState.grid[row][col];
                        if (cell.isMine && !cell.isRevealed && !cell.isFlagged) {
                            revealCell(row, col);
                        } else if (cell.isFlagged && !cell.isMine) {
                            // Show incorrectly flagged cells
                            const cellElement = getCellElement(row, col);
                            cellElement.innerHTML = '<span>❌</span>';
                        }
                    }
                }
            }
        }
        
        function checkWinCondition() {
            const config = GAME_CONFIG[gameState.difficulty];
            let unrevealed = 0;
            
            for (let row = 0; row < config.rows; row++) {
                for (let col = 0; col < config.cols; col++) {
                    if (!gameState.grid[row][col].isRevealed && !gameState.grid[row][col].isMine) {
                        unrevealed++;
                    }
                }
            }
            
            if (unrevealed === 0) {
                gameOver(true);
                
                // Flag all mines
                for (let row = 0; row < config.rows; row++) {
                    for (let col = 0; col < config.cols; col++) {
                        if (gameState.grid[row][col].isMine && !gameState.grid[row][col].isFlagged) {
                            toggleFlag(row, col);
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>
