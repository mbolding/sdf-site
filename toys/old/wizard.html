<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wizard duel 1 · mbolding</title>
<link rel="stylesheet" href="../../style.css">
<script src="../../theme.js"></script>
<style>
.wizard { margin-bottom: 1.2em; }
.wizard h2 { margin-top: 1.2em; }
.wizard p { margin: 0.2em 0; }
#gameLog { max-height: 200px; overflow-y: auto; font: 14px/1.6 var(--font-ui); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 0.6em 0.9em; }
</style>
</head>
<body>
<header><a href="../../">mbolding</a> · <a href="../">Toys</a> · earlier version</header>
<h1>Wizard Duel</h1>
<div class="wizard" id="wizard1">
    <h2>Wizard 1</h2>
    <p>Health: <span id="health1">20</span></p>
    <div class="spells row">
        <button onclick="castSpell(1, 'Fireball')">Fireball</button>
        <button onclick="castSpell(1, 'Healing Light')">Healing Light</button>
        <button onclick="castSpell(1, 'Magic Shield')">Magic Shield</button>
        <button onclick="castSpell(1, 'Energy Drain')">Energy Drain</button>
        <button onclick="castSpell(1, 'Chaos Bolt')">Chaos Bolt</button>
    </div>
</div>
<div class="wizard" id="wizard2">
    <h2>Wizard 2</h2>
    <p>Health: <span id="health2">20</span></p>
    <div class="spells row">
        <button onclick="castSpell(2, 'Fireball')">Fireball</button>
        <button onclick="castSpell(2, 'Healing Light')">Healing Light</button>
        <button onclick="castSpell(2, 'Magic Shield')">Magic Shield</button>
        <button onclick="castSpell(2, 'Energy Drain')">Energy Drain</button>
        <button onclick="castSpell(2, 'Chaos Bolt')">Chaos Bolt</button>
    </div>
</div>
<div id="gameLog"></div>

<script>
        let currentTurn = 1;
        let health = [20, 20];
        let shield = [false, false];

        function castSpell(wizard, spell) {
            if (wizard !== currentTurn) {
                log(`It's not Wizard ${wizard}'s turn!`);
                return;
            }

            const roll = Math.floor(Math.random() * 6) + 1;
            const success = roll >= 4;

            log(`Wizard ${wizard} casts ${spell}. Roll: ${roll} (${success ? 'Success' : 'Fail'})`);

            if (success) {
                switch (spell) {
                    case 'Fireball':
                        dealDamage(wizard === 1 ? 2 : 1, 4);
                        break;
                    case 'Healing Light':
                        heal(wizard, 3);
                        break;
                    case 'Magic Shield':
                        shield[wizard - 1] = true;
                        log(`Wizard ${wizard} is shielded from the next spell.`);
                        break;
                    case 'Energy Drain':
                        dealDamage(wizard === 1 ? 2 : 1, 2);
                        heal(wizard, 2);
                        break;
                    case 'Chaos Bolt':
                        const damage = Math.floor(Math.random() * 6) + 1;
                        dealDamage(wizard === 1 ? 2 : 1, damage);
                        break;
                }
            }

            currentTurn = 3 - currentTurn; // Switch turns (1 -> 2, 2 -> 1)
            updateHealth();
        }

        function dealDamage(target, amount) {
            if (shield[target - 1]) {
                log(`Wizard ${target}'s shield blocks the spell!`);
                shield[target - 1] = false;
            } else {
                health[target - 1] -= amount;
                log(`Wizard ${target} takes ${amount} damage.`);
                if (health[target - 1] <= 0) {
                    log(`Wizard ${target} has been defeated! Wizard ${3 - target} wins!`);
                    disableSpells();
                }
            }
        }

        function heal(wizard, amount) {
            health[wizard - 1] = Math.min(health[wizard - 1] + amount, 20);
            log(`Wizard ${wizard} heals ${amount} health.`);
        }

        function updateHealth() {
            document.getElementById('health1').textContent = Math.max(health[0], 0);
            document.getElementById('health2').textContent = Math.max(health[1], 0);
        }

        function log(message) {
            const gameLog = document.getElementById('gameLog');
            gameLog.innerHTML += message + '<br>';
            gameLog.scrollTop = gameLog.scrollHeight;
        }

        function disableSpells() {
            const buttons = document.querySelectorAll('.spells button');
            buttons.forEach(button => button.disabled = true);
        }

        log('Game started! Wizard 1 goes first.');
</script>
</body>
</html>
