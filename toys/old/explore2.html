<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontier Expedition 2 · mbolding</title>
<link rel="stylesheet" href="../../style.css">
<script src="../../theme.js"></script>
<style>
#game-board { display: grid; grid-template-columns: repeat(15, 20px); gap: 1px; width: max-content; padding: 6px; margin-bottom: 1em;
              background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); }
.cell { width: 20px; height: 20px; border: 1px solid var(--rule); }
.explored { background: color-mix(in srgb, var(--muted) 35%, var(--surface)); }
.supply-cache { background: color-mix(in srgb, var(--good) 55%, var(--surface)); }
.player { background: var(--bad); border-color: var(--bad); }
#resources { font: 15px var(--font-ui); }
#movement-controls { display: grid; grid-template-columns: repeat(3, 40px); grid-template-areas: ". up ." "left . right" ". down ."; gap: 4px; margin: 0.8em 0; }
#movement-controls button { width: 40px; height: 40px; padding: 0; }
#movement-controls button:nth-child(1) { grid-area: up; }
#movement-controls button:nth-child(2) { grid-area: left; }
#movement-controls button:nth-child(3) { grid-area: right; }
#movement-controls button:nth-child(4) { grid-area: down; }
#actions { display: flex; flex-wrap: wrap; gap: 0.6em; }
#message { margin-top: 0.8em; min-height: 1.6em; }
</style>
</head>
<body>
<header><a href="../../">mbolding</a> · <a href="../">Toys</a> · earlier version</header>
<h1>Frontier Expedition</h1>
<div id="game-board"></div>
<div id="resources"></div>
<div id="movement-controls">
  <button onclick="move(0, -1)">↑</button>
  <button onclick="move(-1, 0)">←</button>
  <button onclick="move(1, 0)">→</button>
  <button onclick="move(0, 1)">↓</button>
</div>
<div id="actions">
  <button onclick="rest()">Rest</button>
  <button onclick="hunt()">Hunt</button>
  <button onclick="explore()">Explore</button>
</div>
<div id="message"></div>

<script>
        const BOARD_WIDTH = 15;
        const BOARD_HEIGHT = 10;
        let playerPosition = { x: 0, y: 9 };
        let resources = { food: 8, supplies: 6, health: 4, discoveries: 0 };
        let exploredCells = new Set();
        let supplyCaches = [];

        function initializeGame() {
            const gameBoard = document.getElementById('game-board');
            for (let y = 0; y < BOARD_HEIGHT; y++) {
                for (let x = 0; x < BOARD_WIDTH; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${x}-${y}`;
                    gameBoard.appendChild(cell);
                }
            }
            generateSupplyCaches();
            updateBoard();
            updateResources();
        }

        function generateSupplyCaches() {
            for (let i = 0; i < 3; i++) {
                let x, y;
                do {
                    x = Math.floor(Math.random() * BOARD_WIDTH);
                    y = Math.floor(Math.random() * BOARD_HEIGHT);
                } while ((x === 0 && y === 9) || (x === 14 && y === 0) || supplyCaches.some(cache => cache.x === x && cache.y === y));
                supplyCaches.push({x, y});
                document.getElementById(`cell-${x}-${y}`).classList.add('supply-cache');
            }
        }

        function updateBoard() {
            document.querySelectorAll('.cell').forEach(cell => cell.classList.remove('player'));
            document.getElementById(`cell-${playerPosition.x}-${playerPosition.y}`).classList.add('player');
            exploredCells.forEach(cell => document.getElementById(cell).classList.add('explored'));
        }

        function updateResources() {
            document.getElementById('resources').innerHTML = `
                Food: ${resources.food} | Supplies: ${resources.supplies} | Health: ${resources.health} | Discoveries: ${resources.discoveries}
            `;
        }

        function move(dx, dy) {
            const newX = playerPosition.x + dx;
            const newY = playerPosition.y + dy;
            if (newX >= 0 && newX < BOARD_WIDTH && newY >= 0 && newY < BOARD_HEIGHT) {
                playerPosition.x = newX;
                playerPosition.y = newY;
                resources.food--;
                updateBoard();
                updateResources();
                checkSupplyCache();
                checkGameOver();
            } else {
                setMessage("You can't move in that direction.");
            }
        }

        function checkSupplyCache() {
            const cacheIndex = supplyCaches.findIndex(cache => cache.x === playerPosition.x && cache.y === playerPosition.y);
            if (cacheIndex !== -1) {
                resources.supplies += 3;
                setMessage("You've found a supply cache! +3 Supplies");
                supplyCaches.splice(cacheIndex, 1);
                document.getElementById(`cell-${playerPosition.x}-${playerPosition.y}`).classList.remove('supply-cache');
                updateResources();
            }
        }

        function rest() {
            resources.health = Math.min(resources.health + 1, 5);
            resources.food--;
            updateResources();
            checkGameOver();
        }

        function hunt() {
            const roll = Math.floor(Math.random() * 6) + 1;
            if (roll <= 2) {
                setMessage("Hunt failed.");
            } else if (roll <= 4) {
                resources.food += 1;
                setMessage("Small game caught. +1 Food");
            } else {
                resources.food += 3;
                setMessage("Large game caught. +3 Food");
            }
            resources.supplies--;
            updateResources();
            checkGameOver();
        }

        function explore() {
            const cellId = `cell-${playerPosition.x}-${playerPosition.y}`;
            if (!exploredCells.has(cellId)) {
                exploredCells.add(cellId);
                if (Math.random() < 0.33) {
                    resources.discoveries++;
                    setMessage("Discovery made!");
                } else {
                    setMessage("Nothing of note found.");
                }
            } else {
                setMessage("This area has already been explored.");
            }
            resources.food--;
            updateBoard();
            updateResources();
            checkGameOver();
        }

        function setMessage(msg) {
            document.getElementById('message').textContent = msg;
        }

        function checkGameOver() {
            if (resources.food <= 0 || resources.health <= 0) {
                alert("Game Over! Your expedition has failed.");
                location.reload();
            } else if (playerPosition.x === BOARD_WIDTH - 1 && playerPosition.y === 0) {
                alert(`Congratulations! You've completed the expedition with ${resources.discoveries} discoveries!`);
                location.reload();
            }
        }

        initializeGame();
    </script>
</body>
</html>
