<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Board Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #game-container {
            text-align: center;
        }
        #board {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            grid-gap: 2px;
            margin-bottom: 20px;
        }
        .cell {
            width: 60px;
            height: 60px;
            background-color: #fff;
            border: 1px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
        }
        #message {
            margin-bottom: 10px;
        }
        button {
            font-size: 16px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="board"></div>
        <div id="message">Player 1's turn</div>
        <button id="reset-btn">Reset Game</button>
    </div>

    <script>
        const board = document.getElementById('board');
        const message = document.getElementById('message');
        const resetBtn = document.getElementById('reset-btn');
        let selectedCell = null;
        let currentPlayer = 1;
        let gameBoard = [];

        function initializeBoard() {
            gameBoard = Array(5).fill().map(() => Array(5).fill(0));
            for (let i = 0; i < 5; i++) {
                gameBoard[0][i] = 1;
                gameBoard[4][i] = 2;
            }
            renderBoard();
        }

        function renderBoard() {
            board.innerHTML = '';
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    if (gameBoard[row][col] === 1) {
                        cell.textContent = '🔵';
                    } else if (gameBoard[row][col] === 2) {
                        cell.textContent = '🔴';
                    }
                    cell.addEventListener('click', handleCellClick);
                    board.appendChild(cell);
                }
            }
        }

        function handleCellClick(event) {
            const row = parseInt(event.target.dataset.row);
            const col = parseInt(event.target.dataset.col);

            if (!selectedCell) {
                if (gameBoard[row][col] === currentPlayer) {
                    selectedCell = { row, col };
                    event.target.style.backgroundColor = '#ffff00';
                }
            } else {
                if (isValidMove(selectedCell, { row, col })) {
                    movePiece(selectedCell, { row, col });
                    selectedCell = null;
                    switchPlayer();
                    renderBoard();
                    checkWinCondition();
                }
            }
        }

        function isValidMove(from, to) {
            const rowDiff = Math.abs(from.row - to.row);
            const colDiff = Math.abs(from.col - to.col);
            return (rowDiff <= 1 && colDiff <= 1) && gameBoard[to.row][to.col] !== currentPlayer;
        }

        function movePiece(from, to) {
            gameBoard[to.row][to.col] = currentPlayer;
            gameBoard[from.row][from.col] = 0;
        }

        function switchPlayer() {
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            message.textContent = `Player ${currentPlayer}'s turn`;
        }

        function checkWinCondition() {
            const targetRow = currentPlayer === 1 ? 4 : 0;
            const win = gameBoard[targetRow].some(cell => cell === currentPlayer);
            if (win) {
                message.textContent = `Player ${currentPlayer} wins!`;
                board.removeEventListener('click', handleCellClick);
            }
        }

        resetBtn.addEventListener('click', () => {
            currentPlayer = 1;
            selectedCell = null;
            message.textContent = "Player 1's turn";
            initializeBoard();
        });

        initializeBoard();
    </script>
</body>
</html>
