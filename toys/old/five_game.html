<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board game 1 · mbolding</title>
<link rel="stylesheet" href="../../style.css">
<script src="../../theme.js"></script>
<style>
#board { display: grid; grid-template-columns: repeat(5, 60px); gap: 2px; width: max-content; margin-bottom: 1em; }
.cell { width: 60px; height: 60px; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px;
        display: flex; justify-content: center; align-items: center; cursor: pointer; }
.cell.p1::after, .cell.p2::after { content: ""; width: 36px; height: 36px; border-radius: 50%; pointer-events: none; }
.cell.p1::after { background: var(--link); }
.cell.p2::after { background: var(--bad); }
.cell.selected { background: color-mix(in srgb, var(--warn) 40%, var(--surface)); border-color: var(--warn); }
#message { margin-bottom: 0.6em; font: 16px var(--font-ui); }
</style>
</head>
<body>
<header><a href="../../">mbolding</a> · <a href="../">Toys</a> · earlier version</header>
<h1>Two-player board game</h1>
<p class="small">Player 1 starts on the top row, player 2 on the bottom. Click one of your pieces, then a square next to it; the first to reach the other side wins.</p>
<div id="game-container">
    <div id="board"></div>
    <div id="message">Player 1's turn</div>
    <button id="reset-btn">Reset Game</button>
</div>

<script>
        const board = document.getElementById('board');
        const message = document.getElementById('message');
        const resetBtn = document.getElementById('reset-btn');
        let selectedCell = null;
        let currentPlayer = 1;
        let gameBoard = [];
        let gameOver = false;

        function initializeBoard() {
            gameBoard = Array(5).fill().map(() => Array(5).fill(0));
            for (let i = 0; i < 5; i++) {
                gameBoard[0][i] = 1;
                gameBoard[4][i] = 2;
            }
            renderBoard();
        }

        function renderBoard() {
            board.innerHTML = '';
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    if (gameBoard[row][col] === 1) {
                        cell.classList.add('p1');
                    } else if (gameBoard[row][col] === 2) {
                        cell.classList.add('p2');
                    }
                    cell.addEventListener('click', handleCellClick);
                    board.appendChild(cell);
                }
            }
        }

        function handleCellClick(event) {
            if (gameOver) return;
            const row = parseInt(event.target.dataset.row);
            const col = parseInt(event.target.dataset.col);

            if (!selectedCell) {
                if (gameBoard[row][col] === currentPlayer) {
                    selectedCell = { row, col };
                    event.target.classList.add('selected');
                }
            } else {
                if (isValidMove(selectedCell, { row, col })) {
                    movePiece(selectedCell, { row, col });
                    selectedCell = null;
                    renderBoard();
                    if (!checkWinCondition()) switchPlayer();
                }
            }
        }

        function isValidMove(from, to) {
            const rowDiff = Math.abs(from.row - to.row);
            const colDiff = Math.abs(from.col - to.col);
            return (rowDiff <= 1 && colDiff <= 1) && gameBoard[to.row][to.col] !== currentPlayer;
        }

        function movePiece(from, to) {
            gameBoard[to.row][to.col] = currentPlayer;
            gameBoard[from.row][from.col] = 0;
        }

        function switchPlayer() {
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            message.textContent = `Player ${currentPlayer}'s turn`;
        }

        function checkWinCondition() {
            const targetRow = currentPlayer === 1 ? 4 : 0;
            const win = gameBoard[targetRow].some(cell => cell === currentPlayer);
            if (win) {
                message.textContent = `Player ${currentPlayer} wins!`;
                gameOver = true;
            }
            return win;
        }

        resetBtn.addEventListener('click', () => {
            currentPlayer = 1;
            selectedCell = null;
            gameOver = false;
            message.textContent = "Player 1's turn";
            initializeBoard();
        });

        initializeBoard();
</script>
</body>
</html>
