<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex board 1 · mbolding</title>
<link rel="stylesheet" href="../../style.css">
<script src="../../theme.js"></script>
<style>
#gameContainer { position: relative; margin-top: 1em; }
canvas { display: block; background: var(--surface); border: 1px solid var(--rule); }
.gamePiece { width: 30px; height: 30px; border-radius: 50%; position: absolute; cursor: move; z-index: 10; border: 2px solid var(--surface); }
</style>
</head>
<body>
<header><a href="../../">mbolding</a> · <a href="../">Toys</a> · earlier version</header>
<h1>Hex board with pieces</h1>
<div class="row">
    <label for="rows">Rows:</label>
    <input type="number" id="rows" min="1" max="20" value="6">
    <label for="cols">Columns:</label>
    <input type="number" id="cols" min="1" max="20" value="6">
    <button onclick="generateBoard()">Generate Board</button>
</div>
<p class="small">Double-click the board to place a piece, then drag it.</p>
<div id="gameContainer">
    <canvas id="hexCanvas"></canvas>
</div>

<script>
        const canvas = document.getElementById('hexCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('gameContainer');

        let isDragging = false;
        let draggedPiece = null;
        let dragOffsetX, dragOffsetY;
        let pieceCount = 0;

        function color(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function drawHexagon(x, y, size) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (2 * Math.PI / 6 * i) + (Math.PI / 6);
                const xPos = x + size * Math.cos(angle);
                const yPos = y + size * Math.sin(angle);
                if (i === 0) {
                    ctx.moveTo(xPos, yPos);
                } else {
                    ctx.lineTo(xPos, yPos);
                }
            }
            ctx.closePath();
            ctx.stroke();
        }

        function generateBoard() {
            const rows = parseInt(document.getElementById('rows').value);
            const cols = parseInt(document.getElementById('cols').value);
            const hexSize = 20;
            const hexHeight = hexSize * 2;
            const hexWidth = Math.sqrt(3) * hexSize;

            canvas.width = (cols + 0.5) * hexWidth;
            canvas.height = (rows + 0.5) * (hexHeight * 0.75);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = color('--text');

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const x = col * hexWidth + ((row % 2) * (hexWidth / 2)) + (hexWidth / 2);
                    const y = row * (hexHeight * 0.75) + (hexHeight / 2);
                    drawHexagon(x, y, hexSize);
                }
            }

            gameContainer.style.width = canvas.width + 'px';
            gameContainer.style.height = canvas.height + 'px';
        }

        function createGamePiece(x, y) {
            const piece = document.createElement('div');
            piece.className = 'gamePiece';
            piece.style.left = x + 'px';
            piece.style.top = y + 'px';
            piece.style.backgroundColor = getRandomColor();
            gameContainer.appendChild(piece);

            piece.addEventListener('mousedown', startDragging);
            pieceCount++;
        }

        // A random one of the theme's distinct hues, kept as a var() so it follows the theme.
        function getRandomColor() {
            const hues = ['--link', '--bad', '--good', '--warn', '--muted'];
            return `var(${hues[Math.floor(Math.random() * hues.length)]})`;
        }

        function startDragging(e) {
            isDragging = true;
            draggedPiece = e.target;
            const rect = draggedPiece.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;
        }

        function drag(e) {
            if (isDragging && draggedPiece) {
                const containerRect = gameContainer.getBoundingClientRect();
                let newX = e.clientX - containerRect.left - dragOffsetX;
                let newY = e.clientY - containerRect.top - dragOffsetY;

                // Constrain the game piece within the canvas
                newX = Math.max(0, Math.min(newX, canvas.width - draggedPiece.offsetWidth));
                newY = Math.max(0, Math.min(newY, canvas.height - draggedPiece.offsetHeight));

                draggedPiece.style.left = newX + 'px';
                draggedPiece.style.top = newY + 'px';
            }
        }

        function stopDragging() {
            isDragging = false;
            draggedPiece = null;
        }

        gameContainer.addEventListener('dblclick', function(e) {
            const rect = gameContainer.getBoundingClientRect();
            const x = e.clientX - rect.left - 15; // 15 is half the width of the game piece
            const y = e.clientY - rect.top - 15; // 15 is half the height of the game piece
            createGamePiece(x, y);
        });

        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', stopDragging);

        // Initial board generation
        generateBoard();
        window.addEventListener('themechange', generateBoard);
</script>
</body>
</html>
