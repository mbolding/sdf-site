<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roll dice · mbolding</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<style>
.total { font-size: 3.2em; line-height: 1.1; margin: 0.3em 0 0; }
.dice { display: flex; flex-wrap: wrap; gap: 0.4em; margin-top: 0.6em; }
.die { min-width: 2.2em; padding: 0.25em 0.4em; text-align: center; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); font: 15px var(--font-ui); }
.die.max { border-color: var(--link); color: var(--link); }
.history { list-style: none; padding: 0; }
</style>
</head>
<body>
<header><a href="./">mbolding</a></header>
<h1>Roll dice</h1>

<div class="row" id="presets"></div>
<div class="row">
  <label><input type="number" id="count" value="1" min="1" max="100"> dice</label>
  <label>with <input type="number" id="sides" value="6" min="2" max="1000"> sides</label>
  <label>plus <input type="number" id="bonus" value="0"></label>
  <button class="primary" id="roll">Roll</button>
</div>

<div class="box" id="out" hidden>
  <p class="small" id="what"></p>
  <p class="total" id="total"></p>
  <div class="dice" id="dice"></div>
</div>

<h2>Earlier rolls</h2>
<ul class="history small" id="history"><li>None yet. Press Roll, or Return in any box.</li></ul>

<script>
const $ = id => document.getElementById(id);
const rolls = [];

for (const n of [4, 6, 8, 10, 12, 20, 100]) {
    const b = document.createElement('button');
    b.textContent = 'd' + n;
    b.onclick = () => { $('sides').value = n; roll(); };
    $('presets').appendChild(b);
}

function int(id, fallback, min, max) {
    const v = parseInt($(id).value, 10);
    return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : fallback;
}

// An unbiased whole number from 1 to sides.
function die(sides) {
    const a = new Uint32Array(1), limit = Math.floor(2 ** 32 / sides) * sides;
    do crypto.getRandomValues(a); while (a[0] >= limit);
    return a[0] % sides + 1;
}

function roll() {
    const count = int('count', 1, 1, 100), sides = int('sides', 6, 2, 1000), bonus = int('bonus', 0, -1000, 1000);
    const dice = Array.from({ length: count }, () => die(sides));
    const total = dice.reduce((a, b) => a + b, 0) + bonus;
    const name = count + 'd' + sides + (bonus ? (bonus > 0 ? ' + ' : ' − ') + Math.abs(bonus) : '');

    $('out').hidden = false;
    $('what').textContent = name;
    $('total').textContent = total;
    $('dice').replaceChildren(...dice.map(d => {
        const s = document.createElement('span');
        s.className = 'die' + (d === sides ? ' max' : '');
        s.textContent = d;
        return s;
    }));

    rolls.unshift(name + ' → ' + total + (count > 1 ? '  (' + dice.join(', ') + ')' : ''));
    rolls.length = Math.min(rolls.length, 10);
    $('history').replaceChildren(...rolls.map(h => Object.assign(document.createElement('li'), { textContent: h })));
}

$('roll').onclick = roll;
for (const id of ['count', 'sides', 'bonus'])
    $(id).addEventListener('keydown', e => { if (e.key === 'Enter') roll(); });
</script>
</body>
</html>
