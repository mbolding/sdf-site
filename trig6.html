<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script>
  function plot() {
    var func = document.getElementById('func').value;
    var xMin = parseFloat(document.getElementById('xMin').value);
    var xMax = parseFloat(document.getElementById('xMax').value);
    var x = []; 
    var y = [];
    var increment = (xMax - xMin) / 360;
    var xi = xMin;
    while (xi <= xMax) {
      x.push(xi);
      if (func == 'sin') {
        y.push(Math.sin(xi)); 
      } else if (func == 'cos') {
        y.push(Math.cos(xi));  
      } else if (func == 'tan') {
        y.push(Math.tan(xi));
      }
      xi += increment; 
    }
    
    var data = [{x: x, y: y, mode: 'lines+markers', name: func}];
    var layout = {title: 'Trigonometric function',
                 xaxis: {title: 'Angle (radians)'},
                 yaxis: {title: 'Amplitude'}};
    
    Plotly.newPlot('myDiv', data, layout);
  } 

  window.onload = function() {
    plot();
  }
</script>  
  
</head>
<body>
  <select id="func" onchange="plot()">
    <option value="sin" selected>sin</option>
    <option value="cos">cos</option>
    <option value="tan">tan</option> 
  </select>
  X range:
  <input type="number" id="xMin" value="0" step="0.1" onchange="plot()">
  to
  <input type="number" id="xMax" value="6.283" step="0.1" onchange="plot()">
  <div id="myDiv"></div>
</body>
</html>
